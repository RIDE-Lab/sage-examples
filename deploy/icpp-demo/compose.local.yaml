services:
  demo:
    image: sage-icpp-demo:20260921
    pull_policy: never
    init: true
    ports:
      - "127.0.0.1:${LOCAL_DEMO_PORT:-18400}:18400"
    environment:
      SAGE_LLM_BASE_URL: ""
      SAGE_OPENAI_BASE_URL: ""
      SAGE_LLM_MODEL: ""
      SAGE_OPENAI_MODEL: ""
      SAGE_RERANKER_BASE_URL: ""
      SAGE_EMBEDDING_BASE_URL: ""
    volumes:
      - local-data:/data
    restart: unless-stopped
volumes:
  local-data:
